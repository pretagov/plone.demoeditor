name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@latest check .
      - run: uvx ruff@latest format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plone: ["6.1.3", "6.2.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 .venv
      - run: uv pip install -p .venv/bin/python -e ".[test]" -c https://dist.plone.org/release/${{ matrix.plone }}/constraints.txt
      - run: .venv/bin/pytest

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A news/ fragment
        run: git diff --name-only origin/${{ github.base_ref }}... | grep -q '^news/+'
